name: Release Docker Image to GitHub Container Registry

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'charts/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ebla-network/ebla-node
  DOCKERFILE: Dockerfile

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables
        id: prepare
        run: |
          TAG="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHA_SHORT="${COMMIT_SHA:0:8}"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_sha_short=${COMMIT_SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Generate image tags and metadata
        id: meta
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          REGISTRY_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Tags for this release:
          #   :v2.1.1                 → the immutable release tag (operators pin to this)
          #   :v2.1.1-<short-sha>     → tag + commit (forensic anchor)
          #
          # Note: No floating :latest tag. Validators MUST pin to a specific version.
          # Mixed versions across validators = fork risk for consensus-critical software.
          # This convention is enforced at release time, not left to operator discretion.
          TAGS="${REGISTRY_URL}:${TAG}"
          TAGS="${TAGS},${REGISTRY_URL}:${TAG}-${{ steps.prepare.outputs.commit_sha_short }}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image to ghcr.io
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Create Release Summary
        run: |
          echo "## Docker Image Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** ${{ steps.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.prepare.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            echo "- \`${tag// /}\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "**Image Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
