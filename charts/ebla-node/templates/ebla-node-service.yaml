{{ if .Values.node.enabled }}
# Note: This is a headless service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebla-node.fullname" . }}
  labels:
    name: ebla-node
    app.kubernetes.io/name: ebla-node
    helm.sh/chart: {{ include "ebla-node.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: ebla-node
    app.kubernetes.io/name: {{ include "ebla-node.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  {{- range $port := .Values.node.service.ports }}
    - name: {{ $port.name | default $port.port }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort | default $port.port }}
      {{- if $port.protocol }}
      protocol: {{ $port.protocol }}
      {{- end }}
  {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebla-node.fullname" . }}-head
  labels:
    app.kubernetes.io/name: ebla-node-head
    helm.sh/chart: {{ include "ebla-node.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app: ebla-node
    app.kubernetes.io/name: {{ include "ebla-node.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  {{- range $port := .Values.node.service.ports }}
    - name: {{ $port.name | default $port.port }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort | default $port.port }}
      {{- if $port.protocol }}
      protocol: {{ $port.protocol }}
      {{- end }}
  {{- end }}

{{ if .Values.node.loadBalancer.enabled }}
{{- range $key, $value := .Values.node.loadBalancer.addresses }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-ebla-node-udp-{{ $key }}
  labels:
    name: {{ $.Release.Name }}-ebla-node-udp-{{ $key }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ $value | quote }}
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-ebla-node-{{ $key }}
  ports:
    - name: udp-listen-port
      port: 10002
      targetPort: 10002
      protocol: UDP

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-ebla-node-tcp-{{ $key }}
  labels:
    name: {{ $.Release.Name }}-ebla-node-tcp-{{ $key }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ $value | quote }}
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-ebla-node-{{ $key }}
  ports:
    - name: tcp-listen-port
      port: 10002
      targetPort: 10002
      protocol: TCP
{{- end }}
{{- end }}

{{ if .Values.node.nodePort.enabled }}
{{- range $key, $value := .Values.node.nodePort.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-ebla-node-discovery-{{ $key }}
  labels:
    name: {{ $.Release.Name }}-ebla-node-discovery-{{ $key }}
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-ebla-node-{{ $key }}
  ports:
    - name: udp-listen-port
      port: {{ $value }}
      targetPort: {{ $value }}
      nodePort: {{ $value }}
      protocol: UDP
    - name: tcp-listen-port
      port: {{ $value }}
      targetPort: {{ $value }}
      nodePort: {{ $value }}
      protocol: TCP
{{- end }}
{{- end }}

{{- end }}
