{{ if .Values.node.enabled }}
{{ if .Values.node.indexer.enabled }}
{{- if .Values.node.indexer.ingress.enabled -}}

{{- $fullName := include "ebla-node.fullname" . -}}
{{- $apiIsStable := eq (include "ebla-node.ingress.isStable" .) "true" -}}
{{- $ingressSupportsPathType := eq (include "ebla-node.ingress.supportsPathType" .) "true" -}}
{{- $serviceName := printf "%s-%s" (include "ebla-node.fullname" .) "head" -}}

{{- $servicePortHttp := 8080 -}}

{{- range .Values.node.service.ports }}
  {{ if eq .name "http-indexer"}} {{ $servicePortHttp = .port }} {{ end }}
{{- end }}

{{- $pathType := .Values.node.ingress.pathType | default "ImplementationSpecific" -}}
---
apiVersion: {{ include "ebla-node.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ $fullName }}-indexer
  labels:
    app: ebla-node
    app.kubernetes.io/name: {{ include "ebla-node.name" . }}
    helm.sh/chart: {{ include "ebla-node.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.node.indexer.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if $apiIsStable }}
{{- if .Values.node.indexer.ingress.ingressClassName }}
  ingressClassName: {{ .Values.node.indexer.ingress.ingressClassName }}
{{- end }}
{{- end }}
  {{- if .Values.wildCertDomainSecret }}
  tls:
    - hosts:
        - {{ include "ebla-node.indexerName" . | quote }}
      secretName: {{ .Values.wildCertDomainSecret }}
  {{- end }}
  rules:
    - host: {{ include "ebla-node.indexerName" . | quote }}
      http:
        paths:
          - path: /
            {{- if and $pathType $ingressSupportsPathType }}
            pathType: {{ $pathType }}
            {{- end }}
            backend:
              {{- if $apiIsStable }}
              service:
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePortHttp }}
              {{- else }}
              serviceName: {{ $serviceName }}
              servicePort: {{ $servicePortHttp }}
              {{- end }}
{{- end }}
{{- end }}
{{- end }}
